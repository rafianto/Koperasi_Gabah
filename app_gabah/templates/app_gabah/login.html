<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Koperasi Gabah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #064e3b 0%, #059669 50%, #34d399 100%); }

        .login-card { width: 100%; max-width: 420px; }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon { width: 72px; height: 72px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .login-icon i { color: #fff; font-size: 30px; }
        .login-header h1 { color: #fff; font-size: 28px; font-weight: 800; }
        .login-header p { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 4px; }

        .login-box { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); padding: 36px; }
        .login-box h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .login-box .sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group .input-wrap { position: relative; }
        .form-group .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 14px 12px 42px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; color: #1e293b; outline: none; transition: all 0.15s; font-family: inherit; }
        .form-group input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.12); }
        .form-group input::placeholder { color: #cbd5e1; }

        .login-btn { width: 100%; padding: 13px; background: #059669; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; box-shadow: 0 4px 14px rgba(5,150,105,0.3); }
        .login-btn:hover { background: #047857; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(5,150,105,0.35); }

        .error-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; margin-bottom: 20px; }
        .error-box i { color: #dc2626; font-size: 16px; flex-shrink: 0; }
        .error-box span { font-size: 13px; font-weight: 500; color: #991b1b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon"><i class="fas fa-wheat-awn"></i></div>
            <h1>Koperasi Gabah</h1>
            <p>Sistem Manajemen Terpadu</p>
        </div>

        <div class="login-box">
            <h2>Masuk ke Aplikasi</h2>
            <p class="sub">Masukkan username dan password Anda</p>

            {% if messages %}
                {% for message in messages %}
                <div class="error-box">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" required placeholder="Masukkan username" autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" required placeholder="Masukkan password" autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>
        </div>
    </div>
</body>
</html>
